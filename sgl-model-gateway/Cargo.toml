[workspace]
members = ["bindings/python"]
exclude = ["bindings/golang", "examples"]

[package]
name = "sgl-model-gateway"
version = "0.3.2"
edition = "2021"

[features]
default = ["grpc-client"]
grpc-client = []
grpc-server = []

vendored-openssl = ["openssl/vendored"]

[lints.rust]
unused_qualifications = "warn"

[lib]
name = "smg"
crate-type = ["rlib"]

[[bin]]
name = "sgl-model-gateway"
path = "src/main.rs"

[[bin]]
name = "smg"
path = "src/main.rs"

[[bin]]
name = "amg"
path = "src/main.rs"

[dependencies]
# ---- CLI 与 Web 服务框架 ----
clap = { version = "4", features = ["derive", "env"] }                                    # 命令行参数解析(支持从环境变量读取)
axum = { version = "0.8.6", features = ["macros", "ws", "tracing"] }                       # HTTP/WebSocket 服务框架,承载对外 API
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"] }   # 带 TLS(HTTPS)终止的服务器绑定层
tower = { version = "0.5", features = ["full"] }                                          # 通用 Service/中间件抽象
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors", "timeout", "limit", "request-id", "util"] }  # HTTP 中间件:追踪/压缩/CORS/超时/请求 ID
# ---- 序列化与 HTTP 底层类型 ----
serde = { version = "1.0", features = ["derive"] }                                        # 序列化/反序列化框架
serde_json = { version = "1.0", default-features = false, features = [
    "std",
    "preserve_order",                                                                     # 保留 JSON 字段顺序(OpenAI 兼容性)
] }
bytes = "1.8.0"                                                                           # 零拷贝字节缓冲区(流式转发)
http-body = "1.0"                                                                         # HTTP body 抽象(流式响应)
rand = "0.9.2"                                                                            # 随机数,用于 random / power_of_two 负载均衡策略
reqwest = { version = "0.12.8", features = ["stream", "blocking", "json", "rustls-tls"], default-features = false }  # HTTP 客户端,向后端 worker 转发请求
futures-util = "0.3"                                                                      # 异步 Stream/Future 组合子
futures = "0.3"                                                                           # 异步原语集合
# ---- 并发与哈希 ----
dashmap = "6.1.0"                                                                         # 并发 HashMap(worker 注册表/连接池等共享状态)
blake3 = "1.5"                                                                            # 高速哈希(缓存键)
xxhash-rust = { version = "0.8", features = ["xxh3"] }                                     # 非加密快速哈希(缓存感知前缀/一致性哈希)
bytemuck = { version = "1.21", features = ["derive"] }                                     # 安全的字节与结构体互转
http = "1.1.0"                                                                            # HTTP 基础类型(方法/头/状态码)
tokio = { version = "1.42.0", features = ["full"] }                                       # 异步运行时(网关的核心执行引擎)
async-trait = "0.1"                                                                        # 支持 trait 中的 async 方法(路由策略等抽象)
# ---- 可观测性:日志与追踪 ----
tracing = "0.1"                                                                           # 结构化日志/追踪门面
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }      # 日志采集与格式化(JSON/等级过滤)
tracing-log = "0.2"                                                                        # 桥接 log crate 到 tracing
tracing-appender = "0.2.3"                                                                 # 日志文件输出(--log-dir)
opentelemetry = "0.27"                                                                     # OpenTelemetry API
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }                 # OTel SDK(span 处理/批量导出)
opentelemetry-otlp = { version = "0.27", features = ["trace", "grpc-tonic"] }              # OTLP/gRPC 导出器(分布式追踪)
tracing-opentelemetry = "0.28"                                                             # 打通 tracing 与 OpenTelemetry
chrono = "0.4"                                                                             # 时间戳处理
# ---- Kubernetes 服务发现 ----
kube = { version = "1.1.0", features = ["runtime", "derive"] }                             # K8s 客户端,自动发现/协调 worker Pod
k8s-openapi = { version = "0.25.0", features = ["v1_33"] }                                 # K8s API 资源类型定义
# ---- Prometheus 指标 ----
metrics = "0.24.2"                                                                         # 指标采集门面(smg_* 指标)
metrics-exporter-prometheus = "0.17.0"                                                     # Prometheus 端点导出器
# ---- 通用工具 ----
uuid = { version = "1.10", features = ["v4", "serde"] }                                    # 生成 worker/作业等唯一 ID
parking_lot = "0.12.4"                                                                     # 高性能锁(替代 std Mutex/RwLock)
thiserror = "2.0.12"                                                                       # 定义结构化错误类型
regex = "1.10"                                                                             # 正则匹配(解析器/路由)
memchr = "2.7"  # SIMD 加速的字节模式搜索(流式解析)
url = "2.5.4"                                                                              # URL 解析与校验(worker 地址)
validator = { version = "0.20.0", features = ["derive"] }                                  # 请求体字段校验
tokio-stream = { version = "0.1", features = ["sync"] }                                    # 基于 tokio 的异步流(SSE/流式响应)
anyhow = "1.0"                                                                             # 灵活的错误传播(应用层)
# ---- 网关核心业务组件(内部 crate,gRPC 流水线的 Rust 实现) ----
reasoning-parser = "=1.0.0"                                                                # 推理内容解析器(<think> 分离,DeepSeek/Qwen 等)
openai-protocol = { version = "=1.0.0", features = ["axum"] }                              # OpenAI 兼容协议的请求/响应类型
tool-parser = "=1.0.0"                                                                     # 工具/函数调用解析器(JSON/Pythonic/XML)
llm-tokenizer = "=1.3.2"                                                                   # Rust 原生分词器(gRPC 路由本地分词)
smg-auth = "=1.0.0"                                                                        # 认证与 RBAC(API key / JWT / OIDC)
wfaas = "=1.0.0"                                                                           # 工作流引擎(MCP 服务器注册等后台作业)
data-connector = "=1.0.0"                                                                  # 历史存储连接器(Memory/Oracle/Postgres/Redis)
smg-mcp = "=1.0.0"                                                                         # MCP 客户端集成(工具执行循环)
smg-wasm = "=1.0.0"                                                                        # WASM 中间件扩展
smg-mesh = "=1.0.0"                                                                        # 多实例 Mesh 状态同步
# ---- TLS / 安全 ----
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }        # 纯 Rust TLS 实现(网关 HTTPS / worker mTLS)
rustls-pemfile = "2.2"                                                                     # 解析 PEM 证书/私钥
openssl = "0.10.73"                                                                        # OpenSSL 绑定(部分依赖所需)
# ---- MCP 协议实现 ----
rmcp = { version = "0.8.3", features = ["client", "server",
    "transport-child-process",                                                             # STDIO(本地子进程)传输
    "transport-sse-client-reqwest",                                                        # SSE 传输
    "transport-streamable-http-client-reqwest",                                            # Streamable HTTP 客户端传输
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "reqwest",
    "auth"] }                                                                              # MCP 传输认证
serde_yaml = "0.9"                                                                         # 解析 MCP YAML 配置文件
subtle = "2.6"                                                                             # 常量时间比较(防时序侧信道,校验密钥)
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }        # JWT 签名校验(控制面 OIDC 认证)
num-traits = "0.2"                                                                         # 数值 trait 抽象
num-bigint = "0.4"                                                                         # 大整数(JWT/加密运算)
base64 = "0.22"                                                                            # Base64 编解码
openai-harmony = { git = "https://github.com/openai/harmony", tag = "v0.0.4" }             # GPT-OSS Harmony 响应格式解析
openmetrics-parser = "0.4.4"                                                               # 解析 worker 上报的 OpenMetrics 指标(负载监控)
arc-swap = "1.7.1"                                                                         # 无锁原子替换(热更新配置/路由注册表快照)

# gRPC and Protobuf dependencies
# ---- gRPC 与 Protobuf(SRT gRPC worker 通信) ----
smg-grpc-client = "=1.0.0"                                                                 # 网关到 SRT worker 的 gRPC 客户端封装
tonic = { version = "0.14.2", features = ["gzip", "transport"] }                           # gRPC 框架
prost = "0.14.1"                                                                           # Protobuf 编解码
prost-types = "0.14.1"                                                                     # Protobuf 内置类型
tonic-prost = "0.14.2"                                                                     # tonic 的 prost 编解码集成
bitflags = "2.10.0"                                                                        # 位标志集合
once_cell = "1.21.3"                                                                       # 惰性初始化的全局静态

# CRDT for Mesh state synchronization
# ---- Mesh 状态同步与 Redis ----
crdts = "7.3"                                                                              # 无冲突复制数据类型(多实例状态最终一致)
redis = { version = "0.27.6", features = ["tokio-comp", "json", "connection-manager"] }    # Redis 客户端(历史后端/共享状态)


# wasm dependencies
# ---- WASM 运行时 ----
sha2 = "0.10"                                                                              # SHA-2 哈希(WASM 模块校验)
wasmtime = { version = "38.0", features = ["component-model", "async"] }                    # WASM 运行时,执行可插拔中间件

[build-dependencies]
chrono = { version = "0.4", features = ["clock"] }
toml = "0.9"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
portpicker = "0.1"
tempfile = "3.8"
lazy_static = "1.4"
wasm-encoder = "0.242"
npyz = { version = "0.8", features = ["npz"] }  # For reading numpy .npz files in golden tests
opentelemetry-proto = { version = "0.27", features = ["gen-tonic"] }
tonic-v12 = { version = "0.12.3", package = "tonic" }
serial_test = "3.0"
rsa = { version = "0.9", features = ["sha2"] }

[[bench]]
name = "consistent_hash_bench"
harness = false
path = "benches/consistent_hash_bench.rs"
[[bench]]
name = "wasm_middleware_latency"
harness = false
path = "benches/wasm_middleware_latency.rs"
[[bench]]
name = "request_processing"
harness = false
path = "benches/request_processing.rs"

[[bench]]
name = "router_registry_bench"
harness = false

[[bench]]
name = "manual_policy_benchmark"
harness = false
path = "benches/manual_policy_benchmark.rs"

[[bench]]
name = "streaming_utils_bench"
harness = false
path = "benches/streaming_utils_bench.rs"

[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Full LTO for smaller binaries
codegen-units = 1   # Better optimization, slower compile
strip = true        # Strip debug symbols

[profile.ci]
inherits = "release"
opt-level = 2       # Lighter optimization (still fast runtime, much faster compile)
lto = "thin"        # Thin LTO - good balance
codegen-units = 16  # More parallelization for faster builds
strip = true

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2
debug = false


[profile.dev.build-override]
opt-level = 3
codegen-units = 1

[profile.dev-opt]
inherits = "dev"
opt-level = 1
